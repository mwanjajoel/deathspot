name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Validate compose files
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example --profile backup --profile https config -q
          docker compose -f docker-compose.coolify.yml --env-file .env.example config -q

      # A throwaway Supabase stack with fresh secrets, like `pnpm setup:env && pnpm supabase:up`.
      - name: Start Supabase
        run: |
          node scripts/setup-env.mjs > /dev/null   # don't print the throwaway logins
          docker compose up -d --wait db auth rest meta api-gw

      - name: Build
        run: pnpm build

      # Starting the production build applies the migrations, loads the seed data and creates the
      # first admin (instrumentation.ts), which the integration tests expect.
      - name: Start the app and check health
        run: |
          set -a; . ./.env; set +a
          pnpm start > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Unit and integration tests (100% coverage)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: |
          cat app.log || true
          docker compose logs --no-color --tail 200

  docs:
    name: Developer docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: developer-docs/pnpm-lock.yaml
      - run: pnpm --dir developer-docs install --frozen-lockfile
      - name: Build docs (validates the OpenAPI spec)
        run: pnpm docs:build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    permissions:
      contents: read
      packages: write
    env:
      # Publish only for pushes to main, i.e. what's deployed to deathspot.org.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
