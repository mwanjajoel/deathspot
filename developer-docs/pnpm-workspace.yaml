# Declines install scripts for esbuild and sharp (they ship prebuilds),
# clearing pnpm's build-scripts gate. Adding a package here lets it run scripts.
packages: []
supportedArchitectures:
  cpu:
    - current
    - wasm32
allowBuilds: # pnpm 11
  esbuild: false
  sharp: false
  workerd: false
ignoredBuiltDependencies: # pnpm 10
  - esbuild
  - sharp
  - workerd
overrides:
  # Some build tools pin undici 7 below 7.29.1, which has known vulnerabilities: the OpenAPI
  # parser (@scalar/json-magic pins 7.24.4) and wrangler's miniflare. Lift every copy to a fixed
  # 7.x; drop this once both release a fix.
  "undici@>=7.0.0 <7.29.1": ^7.30.0
  # astro pins http-cache-semantics 4.2.0 (GHSA high severity, fixed in 4.3.0).
  "http-cache-semantics@<4.3.0": ^4.3.0
